name: ci
on: { push: {}, pull_request: {}, schedule: [{ cron: "34 6 * * 1" }], workflow_dispatch: {} }
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python data/generate_raw.py
      - run: pytest -p no:cacheprovider -q
      - run: python -m learnlytics.figures && python -m learnlytics.star_schema
